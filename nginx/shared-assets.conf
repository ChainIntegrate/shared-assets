# Da includere dentro il blocco `server { ... }` di OGNI sito che usa le
# librerie condivise:
#     include /var/www/shared-assets/nginx/shared-assets.conf;
#
# Stesso dominio del sito = nessun problema di CORS per moduli ES e font.
# `^~` impedisce che altre regole con espressioni regolari del sito (es.
# cache per \.js$) intercettino questi percorsi.
location ^~ /shared/ {
    alias /var/www/shared-assets/;
    # Ogni cartella di versione e' immutabile: cache lunga
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff";
}

# File del repo che non devono essere serviti
location ^~ /shared/.git     { return 404; }
location ^~ /shared/tools/   { return 404; }
location ^~ /shared/nginx/   { return 404; }
